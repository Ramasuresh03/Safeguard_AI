<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Women Safety Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon2.jpg') }}">
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
</head>
<body>

<nav class="navbar">
  <div class="logo-container">
    <lottie-player
      src="{{ url_for('static', filename='lottie/VPN Protection.json') }}"
      background="transparent"
      speed="1"
      loop
      autoplay
      style="width:36px;height:36px;">
    </lottie-player>
    <span class="brand-text"><b>SafeGuard</b></span>
  </div>

  <button class="hamburger" id="menuBtn" aria-label="Toggle menu">
    <span></span><span></span><span></span>
  </button>

  <ul class="nav-links" id="navLinks">
    <li><a href="/home">Home</a></li>
    <li><a href="/about">About</a></li>
    <li><a href="/team">Team</a></li>
    <li><a href="/future">Future Scope</a></li>
  </ul>

  <button class="nav-guardian-btn unset" id="guardianNavBtn" title="Set Emergency Guardian">
    <div class="g-dot"></div>
    <span id="guardianNavLabel">Set Guardian</span>
  </button>
</nav>

<main class="main">
{% block content %}{% endblock %}
</main>

<script>
const btn = document.getElementById('menuBtn');
const nav = document.getElementById('navLinks');
btn.addEventListener('click', () => nav.classList.toggle('open'));
nav.querySelectorAll('a').forEach(a => a.addEventListener('click', () => nav.classList.remove('open')));
</script>
</body>
</html>
