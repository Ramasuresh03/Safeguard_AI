<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeGuard — Women Safety AI</title>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon2.jpg') }}">
<script src="https://unpkg.com/@lottiefiles/lottie-player@latest/dist/lottie-player.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Carlito:wght@400;700&family=JetBrains+Mono:wght@600&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width:100%; height:100%; font-family:'Calibri','Carlito','Segoe UI',sans-serif; overflow:hidden; }

/* ════════════════════════════════════════
   BACKGROUND — dark base with a soft light lift
   ════════════════════════════════════════ */
.bg {
  position:fixed; inset:0; z-index:0;
  /* Base is dark navy, not pure black — gives the "light touch" */
  background:
    radial-gradient(ellipse 80% 60% at 10% 15%,  rgba(20,160,115,0.52)  0%, transparent 58%),
    radial-gradient(ellipse 60% 70% at 90% 8%,   rgba(160,85,245,0.40)  0%, transparent 52%),
    radial-gradient(ellipse 70% 55% at 50% 98%,  rgba(170,40,195,0.42)  0%, transparent 56%),
    radial-gradient(ellipse 45% 55% at 3%  88%,  rgba(30,210,230,0.14)  0%, transparent 50%),
    /* Subtle light wash at top center — the "little bit light" effect */
    radial-gradient(ellipse 60% 40% at 50% 0%,   rgba(255,255,255,0.06) 0%, transparent 70%),
    #0b0e1a;  /* slightly lighter than pure black */
  animation: bgBreath 11s ease-in-out infinite alternate;
}
@keyframes bgBreath {
  0%   { filter: brightness(1)    hue-rotate(0deg) saturate(1); }
  100% { filter: brightness(1.07) hue-rotate(5deg) saturate(1.05); }
}

/* Film grain */
.bg::after {
  content:''; position:absolute; inset:0;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  background-size:180px; pointer-events:none; opacity:0.45;
}

/* Soft light haze at top — the "little bit light" wash */
.light-haze {
  position:fixed; top:0; left:0; right:0; height:45vh; z-index:0;
  pointer-events:none;
  background: radial-gradient(ellipse 90% 100% at 50% -10%,
    rgba(200,160,255,0.09) 0%,
    rgba(150,220,255,0.05) 40%,
    transparent 100%);
}

/* Floating orbs */
.orb { position:fixed; border-radius:50%; filter:blur(88px); pointer-events:none; z-index:1; animation:orbDrift ease-in-out infinite alternate; }
.o1  { width:400px; height:400px; background:rgba(215,75,135,0.15);  top:-120px; left:-90px;  animation-duration:19s; }
.o2  { width:320px; height:320px; background:rgba(150,72,245,0.18);  top:28%;   right:-75px; animation-duration:25s; animation-delay:-7s; }
.o3  { width:260px; height:260px; background:rgba(20,205,215,0.10);  bottom:-20px; left:12%; animation-duration:21s; animation-delay:-11s; }
/* Extra warm light orb — adds the subtle lightness */
.o4  { width:350px; height:350px; background:rgba(255,220,160,0.04); top:10%;   left:35%;   animation-duration:28s; animation-delay:-5s; }
@keyframes orbDrift { 0%{transform:translate(0,0) scale(1)} 100%{transform:translate(22px,-18px) scale(1.05)} }

/* Tech grid */
.grid {
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background-image:
    linear-gradient(rgba(34,211,238,0.028) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,238,0.028) 1px, transparent 1px);
  background-size:64px 64px;
}

/* Particle canvas */
#pcv { position:fixed; inset:0; z-index:1; pointer-events:none; }

/* blink used by eyebrow dot */
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.2} }

/* ════════════════════════════════════════
   PAGE — perfect center
   ════════════════════════════════════════ */
.page {
  position:relative; z-index:10;
  height:100vh;
  display:flex; align-items:center; justify-content:center;
  padding:24px;
}
.hero {
  display:flex; flex-direction:column;
  align-items:center; text-align:center;
  max-width:600px; width:100%;
}

/* Eyebrow pill */
.eyebrow {
  display:inline-flex; align-items:center; gap:8px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.11);
  border-radius:30px; padding:6px 20px;
  font-size:10.5px; font-weight:700;
  letter-spacing:2.5px; text-transform:uppercase;
  color:rgba(255,255,255,0.42);
  margin-bottom:22px;
  animation:fadeUp 0.7s 0.1s ease both;
}
.edot {
  width:6px; height:6px; border-radius:50%;
  background:#e05c8a; box-shadow:0 0 9px #e05c8a;
  animation:blink 2s infinite;
}

/* ════════════════════════════════════════
   LOTTIE — with floating stat pills
   ════════════════════════════════════════ */
.lottie-wrap {
  position:relative; width:190px; height:190px;
  margin-bottom:22px;
  animation:fadeUp 0.7s 0.15s ease both;
}

/* Glow behind lottie */
.lg {
  position:absolute; inset:-22px; border-radius:50%;
  background:radial-gradient(circle, rgba(224,92,138,0.22) 0%, transparent 68%);
  animation:gPulse 3.5s ease-in-out infinite alternate;
}
@keyframes gPulse { 0%{transform:scale(0.88);opacity:0.6} 100%{transform:scale(1.12);opacity:1} }

/* Spinning dashed rings */
.lr  { position:absolute; inset:-10px; border-radius:50%; border:1.5px dashed rgba(224,92,138,0.32); animation:spin 20s linear infinite; }
.lr2 { position:absolute; inset:-24px; border-radius:50%; border:1px   dashed rgba(34,211,238,0.18);  animation:spin 32s linear infinite reverse; }
@keyframes spin { to{transform:rotate(360deg)} }

/* ── Floating biometric stat pills ── */
.spill {
  position:absolute;
  display:flex; align-items:center; gap:9px;
  /* subtle frosted glass — light touch */
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,0.14);
  border-radius:36px; padding:9px 15px;
  white-space:nowrap;
  box-shadow:0 8px 28px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.04);
  animation:pillBob ease-in-out infinite alternate;
  z-index:5;
}
@keyframes pillBob { 0%{transform:translateY(0)} 100%{transform:translateY(-9px)} }

.sp-icon { font-size:17px; }
.sp-label { display:block; font-size:9.5px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:rgba(255,255,255,0.38); line-height:1; }
.sp-val   { display:block; font-family:'JetBrains Mono',monospace; font-size:16px; font-weight:600; line-height:1.1; margin-top:1px; }

/* Pill positions + individual bob timings */
.sp-hr     { top:-14px;  left:-90px;  animation-duration:4s; }
.sp-hr   .sp-val { color:#f87171; }

.sp-spo2   { top:10px;   right:-88px; animation-duration:5.2s; animation-delay:-1.5s; }
.sp-spo2 .sp-val { color:#38bdf8; }

.sp-stress { bottom:20px; left:-96px; animation-duration:4.8s; animation-delay:-2.8s; }
.sp-stress .sp-val { color:#fbbf24; }

.sp-safe   { bottom:-8px; right:-82px; animation-duration:3.8s; animation-delay:-0.8s; }
.sp-safe .sp-val  { color:#4ade80; }

/* ════════════════════════════════════════
   TITLE
   ════════════════════════════════════════ */
.title {
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(54px, 9.5vw, 96px);
  line-height:0.88; letter-spacing:2px;
  margin-bottom:16px;
  animation:fadeUp 0.7s 0.22s ease both;
}
.t1 { display:block; color:#ffffff; }
.t2 {
  display:block;
  background:linear-gradient(135deg, #e05c8a 0%, #a855f7 50%, #22d3ee 100%);
  background-size:200%;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
  animation:shimmer 5s 1s ease-in-out infinite alternate;
}
.t3 { display:block; color:rgba(255,255,255,0.68); }
@keyframes shimmer { 0%{background-position:0%} 100%{background-position:100%} }

/* Tagline */
.tagline {
  font-size:15px; line-height:1.72;
  color:rgba(255,255,255,0.44);
  margin-bottom:26px;
  animation:fadeUp 0.7s 0.32s ease both;
}
.tagline strong { color:rgba(255,255,255,0.76); }

/* ════════════════════════════════════════
   CTA — centered, glowing
   ════════════════════════════════════════ */
.cta-wrap {
  display:flex; flex-direction:column; align-items:center; gap:10px;
  animation:fadeUp 0.7s 0.44s ease both;
  margin-bottom:28px;
}
.cta {
  display:inline-flex; align-items:center; justify-content:center; gap:13px;
  background:linear-gradient(135deg, #e05c8a 0%, #a855f7 100%);
  color:#fff; text-decoration:none;
  padding:18px 52px; border-radius:50px;
  font-family:'Calibri','Carlito',sans-serif;
  font-size:18px; font-weight:700;
  min-width:245px;
  box-shadow:
    0 0 0 1px rgba(224,92,138,0.28),
    0 10px 40px rgba(224,92,138,0.38),
    0 2px 10px rgba(0,0,0,0.3);
  transition:transform 0.26s cubic-bezier(0.22,1,0.36,1), box-shadow 0.26s;
  position:relative; overflow:hidden;
  /* Subtle inner glow — the light touch */
  border-top: 1px solid rgba(255,255,255,0.18);
}
/* Shine sweep */
.cta::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(110deg, transparent 25%, rgba(255,255,255,0.22) 50%, transparent 75%);
  transform:translateX(-130%); transition:transform 0.55s ease;
}
.cta:hover {
  transform:translateY(-4px) scale(1.03);
  box-shadow:
    0 0 0 1px rgba(224,92,138,0.5),
    0 22px 64px rgba(224,92,138,0.46),
    0 4px 16px rgba(0,0,0,0.3);
}
.cta:hover::before { transform:translateX(130%); }

.cta-arr {
  width:28px; height:28px; border-radius:50%;
  background:rgba(255,255,255,0.2);
  display:flex; align-items:center; justify-content:center;
  font-size:14px; transition:transform 0.26s;
}
.cta:hover .cta-arr { transform:translateX(5px); }
.cta-hint { font-size:11.5px; color:rgba(255,255,255,0.22); letter-spacing:0.3px; }

/* ════════════════════════════════════════
   CHIPS — feature pills at bottom
   ════════════════════════════════════════ */
.chips {
  display:flex; gap:9px; flex-wrap:wrap; justify-content:center;
  animation:fadeUp 0.7s 0.55s ease both;
}
.chip {
  display:flex; align-items:center; gap:6px;
  /* slight light frost */
  background:rgba(255,255,255,0.055);
  border:1px solid rgba(255,255,255,0.09);
  border-radius:30px; padding:7px 14px;
  font-size:12px; font-weight:600;
  color:rgba(255,255,255,0.46);
  transition:all 0.22s;
}
.chip:hover {
  background:rgba(255,255,255,0.10);
  border-color:rgba(255,255,255,0.18);
  color:rgba(255,255,255,0.82);
  transform:translateY(-2px);
  box-shadow:0 4px 14px rgba(0,0,0,0.18);
}

/* ════════════════════════════════════════
   KEYFRAMES & RESPONSIVE
   ════════════════════════════════════════ */
@keyframes fadeUp   { from{opacity:0;transform:translateY(22px)}  to{opacity:1;transform:none} }

@media (max-width: 640px) {
  .lottie-wrap { width:150px; height:150px; }
  .lottie-wrap lottie-player { width:150px !important; height:150px !important; }
  /* Hide pills on small screens to avoid clipping */
  .spill { display:none; }
  .title { font-size:clamp(48px, 13vw, 72px); }
  .chips { gap:7px; }
  .chip  { font-size:11px; padding:6px 11px; }
  .cta   { padding:15px 36px; font-size:16px; min-width:200px; }
}
@media (max-width: 400px) {
  .title { font-size:clamp(42px, 14vw, 60px); }
}
</style>
</head>
<body>

<!-- BG layers -->
<div class="bg"></div>
<div class="light-haze"></div>
<div class="grid"></div>
<div class="orb o1"></div>
<div class="orb o2"></div>
<div class="orb o3"></div>
<div class="orb o4"></div>
<canvas id="pcv"></canvas>

<!-- Centered hero -->
<main class="page">
  <div class="hero">
<br>
    <!-- Eyebrow 
    <div class="eyebrow">
      <span class="edot"></span>
      AI · Women Safety · CSE Final Year 2024–25
    </div>-->

    <!-- Lottie + floating pills -->
    <div class="lottie-wrap">
      <div class="lg"></div>
      <div class="lr"></div>
      <div class="lr2"></div>

      <lottie-player
        src="{{ url_for('static', filename='lottie/Woman tracked.json') }}"
        background="transparent" speed="0.6" loop autoplay
        style="width:190px;height:190px;position:relative;z-index:2;">
      </lottie-player>

      <!-- Floating stat pills — from the first version -->
      <div class="spill sp-hr">
        <span class="sp-icon">💓</span>
        <div><span class="sp-label">Heart Rate</span><span class="sp-val">72 bpm</span></div>
      </div>
      <div class="spill sp-spo2">
        <span class="sp-icon">🫁</span>
        <div><span class="sp-label">SpO2</span><span class="sp-val">98%</span></div>
      </div>
      <div class="spill sp-stress">
        <span class="sp-icon">🧠</span>
        <div><span class="sp-label">Stress</span><span class="sp-val">Low</span></div>
      </div>
      <div class="spill sp-safe">
        <span class="sp-icon">🛡️</span>
        <div><span class="sp-label">Status</span><span class="sp-val">Safe</span></div>
      </div>
    </div>

    <!-- Title -->
    <h1 class="title">
      <span class="t1">WOMEN</span>
      <span class="t2">SAFETY</span>
      <span class="t3">GUARDIAN</span>
    </h1>

    <!-- Tagline -->
    <p class="tagline">
      <strong>AI-powered</strong> real-time biometric monitoring that detects threats
      and sends emergency alerts automatically.
    </p>

    <!-- CTA button -->
    <div class="cta-wrap">
      <a href="/home" class="cta">
        Enter Dashboard
        <div class="cta-arr">→</div>
      </a>
      <span class="cta-hint">Live monitoring · No login required</span>
    </div>

    <!-- Feature chips 
    <div class="chips">
      <span class="chip">💓 Heart Rate</span>
      <span class="chip">🧠 Stress Level</span>
      <span class="chip">🫁 SpO2</span>
      <span class="chip">🚨 Auto SOS</span>
    </div>-->

  </div>
</main>

<!-- Particle script -->
<script>
(function(){
  const cv=document.getElementById('pcv'), ctx=cv.getContext('2d');
  let W, H, D=[];
  function resize(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  function init(n){
    D=Array.from({length:n},()=>({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.3+0.3,
      vx:(Math.random()-.5)*.24, vy:(Math.random()-.5)*.24,
      a:Math.random()*.38+.09,
      h:Math.random()<.5?200:330
    }));
  }
  function loop(){
    ctx.clearRect(0,0,W,H);
    D.forEach(d=>{
      d.x+=d.vx; d.y+=d.vy;
      if(d.x<0)d.x=W; if(d.x>W)d.x=0;
      if(d.y<0)d.y=H; if(d.y>H)d.y=0;
      ctx.beginPath(); ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle=`hsla(${d.h},78%,72%,${d.a})`; ctx.fill();
    });
    for(let i=0;i<D.length;i++) for(let j=i+1;j<D.length;j++){
      const dx=D[i].x-D[j].x, dy=D[i].y-D[j].y, dist=Math.sqrt(dx*dx+dy*dy);
      if(dist<100){
        ctx.beginPath(); ctx.moveTo(D[i].x,D[i].y); ctx.lineTo(D[j].x,D[j].y);
        ctx.strokeStyle=`rgba(34,211,238,${(1-dist/100)*.07})`; ctx.lineWidth=.7; ctx.stroke();
      }
    }
    requestAnimationFrame(loop);
  }
  window.addEventListener('resize',()=>{ resize(); init(60); });
  resize(); init(60); loop();
})();
</script>

</body>
</html>
